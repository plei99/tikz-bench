name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "README.md", "README.zh.md", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "README.md", "README.zh.md", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; a moved tag cannot change what
      # builds or deploys the site.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bun Bake (`bun build --app`) is only in canary builds.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Check and test
        working-directory: website
        run: |
          bun run check
          bun run test
      - name: Build public site
        working-directory: website
        # Every local URL is built under SITE_URL; this works for project Pages and custom domains.
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: bun run build
      - name: Validate generated site
        working-directory: website
        run: bun run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: website/dist
          include-hidden-files: true

  deploy:
    needs: build
    # Publishing is enabled when the repository becomes public. PRs only build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: dist
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
