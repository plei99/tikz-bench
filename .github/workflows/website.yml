name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "README.md", "README.zh.md", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "README.md", "README.zh.md", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Bun Bake (`bun build --app`) is only in canary builds.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Check and test
        working-directory: website
        run: |
          bun run check
          bun run test
      - name: Build public site
        working-directory: website
        # Every local URL is built under SITE_URL; this works for project Pages and custom domains.
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: bun run build
      - name: Validate generated site
        working-directory: website
        run: bun run verify
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist
          include-hidden-files: true

  deploy:
    needs: build
    # Publishing is enabled when the repository becomes public. PRs only build.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: website
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
